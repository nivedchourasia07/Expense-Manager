{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="card auth-card">
    <h2>📝 Create Your Account</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. nived" autocomplete="username" minlength="3" maxlength="32" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" maxlength="128" required>
        <label>Confirm password</label>
        <input type="password" name="confirm" placeholder="Type it again" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button type="submit" class="btn" style="width:100%;margin-top:16px">Sign Up</button>
    </form>
    <p class="center muted" style="margin-top:14px">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary);font-weight:700">Log in</a></p>
</div>
{% endblock %}
